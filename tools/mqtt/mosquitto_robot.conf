# Mosquitto broker for the robot car (INF2004 P1-2).
# Start it from a terminal (keep the window open while you use the car):
#   & "C:\Program Files\mosquitto\mosquitto.exe" -c "<this file>" -v
#
# Mosquitto 2.x only accepts connections from THIS PC unless a listener
# is given.  This opens port 1883 to the local network, without a
# password: use it only on your own hotspot, not a shared network.
listener 1883 0.0.0.0
allow_anonymous true
